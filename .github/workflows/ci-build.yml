name: Validate macOS build

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build
        run: |
          set -euo pipefail
          swift build --build-tests

      - name: Run tests
        run: |
          set -euo pipefail
          swift test
